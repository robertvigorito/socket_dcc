[project]
name = "socket-dcc"
version = "0.1.0"
description = "Socket DCC application for running code from a terminal to a DCC environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "nuix",
    "rich>=15.0.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "pylint>=3.2",
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-sugar>=1.0",
    "pytest-cov>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--cov=nuix", "--cov-report=term-missing"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pylint.main]
py-version = "3.10"

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv.sources]
nuix = { path = "../nuix", editable = true }
