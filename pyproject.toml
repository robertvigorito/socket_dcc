[project]
name = "socket-dcc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rvigorito", email = "rvigorito@d2.com" }
]
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2", "typer>=0.12,<0.28", "python-dotenv>=1.0.0", "rich>=13.0.0"]

[project.scripts]
socket-dcc = "socket_dcc:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
