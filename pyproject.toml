[project]
name = "socket-dcc"
version = "0.1.0"
description = "Socket DCC application for running code from a terminal to a DCC environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Qt.py>=1.4.1",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "typer>=0.12",
    "types-nuke>=13.2.8.0",
]

[project.scripts]
socket-dcc = "socket_dcc.cli.initiate:main"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socket_dcc"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "PySide6>=6.7",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "pylint>=3.2",
    "pytest>=8.0",
    "ruff>=0.5",
    "pytest-sugar>=1.0",
    "pytest-cov>=6.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--cov=socket_dcc", "--cov-report=term-missing"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

